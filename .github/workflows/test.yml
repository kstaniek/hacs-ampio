name: Integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: HA ${{ matrix.ha }} / aioampio ${{ matrix.aioampio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.11.0", "dev"]
        aioampio: ["1.0.2", "2.0.2", "2.1.0", "2.2.0", "2.3.0"]
    steps:
      - name: Check out integration
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - name: Install minimum supported HA and official fixtures
        if: matrix.ha != 'dev'
        run: python -m pip install "homeassistant==${{ matrix.ha }}" "pytest-homeassistant==${{ matrix.ha }}"
      - name: Check out pinned development Core
        if: matrix.ha == 'dev'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          repository: home-assistant/core
          ref: dc542e15890f1454c1fad76a1df3f4b8afa686dc
          path: core
      - name: Install development HA and official fixtures
        if: matrix.ha == 'dev'
        run: python -m pip install -e ./core -e ./core/packages/pytest-homeassistant
      - name: Install selected library
        run: python -m pip install "aioampio==${{ matrix.aioampio }}"
      - name: Verify selected library
        env:
          EXPECTED_AIOAMPIO: ${{ matrix.aioampio }}
        run: |
          python - <<'PYTHON'
          import os
          from importlib.metadata import version
          import aioampio
          from aioampio import AmpioBridge
          expected = os.environ["EXPECTED_AIOAMPIO"]
          assert version("aioampio") == expected
          if expected != "1.0.2":
              assert hasattr(AmpioBridge, "module_metrics")
              assert hasattr(aioampio, "AmpioTransmissionError")
          if expected in ("2.1.0", "2.2.0", "2.3.0"):
              assert callable(getattr(AmpioBridge, "subscribe_reconnects", None))
          if expected in ("2.2.0", "2.3.0"):
              from aioampio.models.light import Light
              assert "members" in Light.__dataclass_fields__
          if expected == "2.3.0":
              from aioampio.models.config import MASKED_LIGHT_OUTPUT_COUNTS, DeviceType
              assert MASKED_LIGHT_OUTPUT_COUNTS[DeviceType.MREL8S] == 8
          PYTHON
      - name: Run integration tests
        run: python -m pytest -q
